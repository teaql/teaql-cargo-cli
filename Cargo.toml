[package]
name = "cargo-teaql"
version = "2.0.14"
edition = "2024"
description = "Rust CLI for TeaQL service code generation workflows"
license = "MIT"
repository = "https://github.com/teaql/teaql-cargo-cli"
homepage = "https://github.com/teaql/teaql-cargo-cli"
readme = "README.md"
include = ["src/**/*", "assets/**/*", "README.md", "LICENSE"]

[[bin]]
name = "cargo-teaql"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22.1"
chrono = "0.4.45"
clap = { version = "4.5", features = ["derive"] }
dialoguer = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "multipart", "rustls"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
roxmltree = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
syn = { version = "2.0", features = ["full", "visit"] }
tempfile = "3.12"
tree-sitter = "0.25.10"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-python = "0.25.0"
tree-sitter-swift = "0.7.3"
tree-sitter-typescript = "0.23.2"
walkdir = "2.5"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
